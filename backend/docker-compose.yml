services:
  db:
    image: postgres:17.4
    environment:
      POSTGRES_DB: saathi
      POSTGRES_USER: saathi
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saathi -d saathi"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://saathi:local-only@db:5432/saathi
      JWT_SECRET: local-development-secret-replace-before-deploy-000000
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://saathi:local-only@db:5432/saathi
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-replace-before-deploy-000000
      PROVIDER_MODE: sandbox
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      migrate: {condition: service_completed_successfully}

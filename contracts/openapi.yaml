        pending_receivable_draft:
          anyOf:
          - $ref: '#/components/schemas/PendingReceivableDraft'
          - type: 'null'
      type: object
      required:
      - answer
      - sources
      title: AssistantResponse
    CampaignIn:
      properties:
        name:

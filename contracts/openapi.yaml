        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/query:
    post:
      summary: Assistant Query
      operationId: assistant_query_assistant_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ActionCreate:
      properties:
        kind:
          type: string
          pattern: ^(purchase_order|campaign|credit_application|report_share)$
          title: Kind
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - kind
      - payload
      title: ActionCreate
    ActionOut:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          title: Kind
        status:
          type: string
          title: Status
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - kind
      - status
      - expires_at
      title: ActionOut
    AssistantRequest:
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        response_language:
          anyOf:
          - type: string
            enum:

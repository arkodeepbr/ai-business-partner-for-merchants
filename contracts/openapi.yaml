      title: CustomerIn
    GoogleSignInRequest:
      properties:
        id_token:
          type: string
          maxLength: 8192
          minLength: 1
          title: Id Token
      type: object
      required:
      - id_token
      title: GoogleSignInRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportedTransaction:
      properties:
        external_id:
          type: string
          maxLength: 120
          minLength: 1
          title: External Id
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
        status:
          type: string
          pattern: ^(succeeded|failed|refunded)$
          title: Status
        payment_method:
          type: string
          maxLength: 32
          title: Payment Method
          default: unknown
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        sender_name:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Sender Name
        sender_reference:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Sender Reference
        sender_contact:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Sender Contact
      type: object
      required:
      - external_id
      - amount
      - status
      - occurred_at

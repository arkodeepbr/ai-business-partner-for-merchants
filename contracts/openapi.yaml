          maxLength: 180
          minLength: 1
          title: Name
        sku:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Sku
        quantity:
          type: integer
          minimum: 0.0
          title: Quantity
          default: 0
        reorder_level:
          type: integer
          minimum: 0.0
          title: Reorder Level
          default: 0
        unit:
          type: string
          maxLength: 24
          title: Unit
          default: unit
      type: object
      required:
      - name
      title: ProductCreate
    ProductOut:
      properties:
        name:
          type: string
          maxLength: 180
          minLength: 1
          title: Name
        sku:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Sku
        quantity:
          type: integer
          minimum: 0.0
          title: Quantity
          default: 0
        reorder_level:
          type: integer
          minimum: 0.0
          title: Reorder Level
          default: 0
        unit:
          type: string

          maxLength: 180
          minLength: 1
          title: Name
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
      type: object
      required:
      - name
      - message
      title: CampaignIn
    ConsentIn:
      properties:
        consent:
          type: boolean
          title: Consent
      type: object
      required:
      - consent
      title: ConsentIn
    CustomerIn:
      properties:
        display_name:
          type: string
          maxLength: 180
          minLength: 1
          title: Display Name
        contact_hash:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Contact Hash
      type: object
      required:

openapi: 3.1.0
info:
  title: Paytm Saathi Shared API
  version: 1.0.0
  description: Shared Android and web contract. Only currently implemented backend endpoints are listed.
servers:
  - url: http://localhost:8000
    description: Local backend
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      tags: [operations]
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      security: []
      tags: [operations]
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database is unavailable }
  /api/v1/me:
    get:
      tags: [identity]
      responses:
        '200':
          description: Authenticated user and organization memberships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/workspace:
    get:
      tags: [identity]
      summary: Read the signed-in user's saved Saathi messages and preferences
      responses:
        '200':
          description: Private account workspace data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [identity]
      summary: Save the signed-in user's Saathi messages or language preference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceDataUpdate' }
      responses:
        '200':
          description: Updated private account workspace data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid workspace data }
  /api/v1/me/finance:
    get:
      tags: [identity]
      summary: Read the signed-in user's private loans, IOU ledger, and recorded transfer history
      responses:
        '200':
          description: Account-owned finance records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecords' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [identity]
      summary: Save the signed-in user's private finance records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceRecordsUpdate' }
      responses:
        '200':
          description: Updated account-owned finance records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceRecords' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid finance record }
  /api/v1/auth/session:
    post:
      security: []
      tags: [identity]
      summary: Exchange a verified Supabase access token for a Saathi API session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string, minLength: 20 }
      responses:
        '200':
          description: Short lived Saathi API bearer session
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [bearer] }
                  expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: A verified email or phone is required }
        '409': { description: Verified email and phone belong to different existing API accounts }
        '503': { description: Supabase session validation is not configured or temporarily unavailable }
  /api/v1/organizations/{organization_id}/analytics/sales:
    get:
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: from_at
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to_at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Gross successful payment collection in a half-open time window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Invalid time range or mixed currencies }
  /api/v1/organizations/{organization_id}/transactions:
    get:
      tags: [transactions]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Recent transactions belonging to this organization
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/organizations/{organization_id}/assistant:
    post:
      tags: [assistant]
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantRequest' }
      responses:
        '200':
          description: Safe response; reports unavailable provider until grounded runtime is configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/assistant/chat:
    post:
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantChatRequest' }
      responses:
        '200':
          description: Authenticated general conversation without merchant records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
    NotFound:
      description: Organization is absent or inaccessible to this user
  schemas:
    MeResponse:
      type: object
      required: [user_id, organizations]
      properties:
        user_id: { type: string }
        organizations:
          type: array
          items:
            type: object
            required: [id, role]
            properties:
              id: { type: string }
              role: { type: string }
    WorkspaceMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
    WorkspaceData:
      type: object
      required: [assistant_messages, preferred_locale]
      properties:
        assistant_messages:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMessage' }
        preferred_locale: { type: string, enum: [en, hi, kn] }
    WorkspaceDataUpdate:
      type: object
      properties:
        assistant_messages:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMessage' }
        preferred_locale: { type: string, enum: [en, hi, kn] }
    FinanceRecord:
      type: object
      required: [id, kind, name, amount_minor, occurred_at]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [contact_added, money_lent, money_repaid, money_borrowed, money_borrowed_repaid, loan_taken, loan_payment, transfer_recorded, inventory_item, inventory_adjustment, inventory_sale, inventory_return, expense_recorded] }
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 30 }
        amount_minor: { type: integer, minimum: 0, maximum: 100000000000 }
        occurred_at: { type: string, format: date-time }
        due_date: { type: [string, 'null'], format: date }
        related_record_id: { type: [string, 'null'], maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 300 }
        annual_interest_bps: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        duration_months: { type: [integer, 'null'], minimum: 1, maximum: 600 }
        quantity: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }
        quantity_delta: { type: [integer, 'null'], minimum: -1000000, maximum: 1000000 }
        unit_cost_minor: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        unit_price_minor: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        discount_minor: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        fees_minor: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
    FinanceRecords:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/FinanceRecord' }
    FinanceRecordsUpdate:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/FinanceRecord' }
    AssistantRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
    AssistantChatRequest:
      type: object
      required: [messages, locale]
      properties:
        locale: { type: string, enum: [en, hi, kn] }
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/AssistantChatMessage' }
    AssistantChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 1500 }
    AssistantResponse:
      type: object
      required: [answer, evidence, grounded]
      properties:
        answer: { type: string }
        evidence: { type: object, additionalProperties: true }
        grounded: { type: boolean }
    SalesSummary:
      type: object
      required: [organization_id, from_at, to_at, currency, gross_collections_minor, transaction_count, average_transaction_minor, definition, data_source]
      properties:
        organization_id: { type: string, format: uuid }
        from_at: { type: string, format: date-time }
        to_at: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3 }
        gross_collections_minor: { type: integer, format: int64 }
        transaction_count: { type: integer }
        average_transaction_minor: { type: integer, format: int64 }
        definition: { type: string }
        data_source: { type: string }
    Transaction:
      type: object
      required: [id, occurred_at, amount_minor, currency, status]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        payment_method: { type: [string, 'null'] }
